name: Karate API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1-5' # weekdays 09:00 IST: catches changes in the live API
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mock server (offline)
            tags: '--tags @mock'
            artifact: karate-report-mock
          - name: Live API
            tags: '--tags ~@mock'
            artifact: karate-report-live
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Karate
        run: mvn -B test "-Dkarate.options=${{ matrix.tags }}"

      - name: Upload Karate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: target/karate-reports/
          retention-days: 14
